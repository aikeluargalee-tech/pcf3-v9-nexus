name: PCF3 Market Data Collector & Deploy

on:
  schedule:
    # Run every 4 hours (at minute 0)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web / Mobile App

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pcf3-collector"
  cancel-in-progress: false

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run PCF3 Collector
        run: |
          python pcf3_collector_default.py

      - name: Commit and Push Updated Packet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PCF3_LIVE_PACKET_DEFAULT.txt
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No packet changes to commit."
          else
            git commit -m "chore: auto-refresh PCF3_LIVE_PACKET_DEFAULT.txt [skip ci]"
            git push
          fi
